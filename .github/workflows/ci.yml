name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t typecheck,build,test
      - name: Registry, tokens and variant docs
        run: |
          node tools/registry/build.mjs --check
          node tools/tokens/build.mjs --check
          node tools/tokens/check.mjs
          node tools/docs/variants-md.mjs --check
      - run: pnpm exec playwright install chromium --with-deps
      - name: Storybook story smoke test
        run: |
          pnpm --filter @brett_lamy/catalog storybook --no-open --quiet &
          npx wait-on http://localhost:6006/index.json -t 120000
          pnpm test:stories
