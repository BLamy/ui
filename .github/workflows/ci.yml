name: CI
# Pull requests only: merging to main deploys through deploy-docs.yml, which runs its own checks.
on: [pull_request]
# A newer push to the same PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # vendor/ui-sdk (our UI SDK fork) is a submodule; `pnpm install` compiles it, and the library's build copies it in.
        with: { submodules: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint,typecheck,build,test
      - name: Dead code (knip)
        run: pnpm knip --no-progress
      - name: Registry, tokens and variant docs
        run: |
          node tools/registry/build.mjs --check
          node tools/tokens/build.mjs --check
          node tools/tokens/check.mjs
          node tools/docs/variants-md.mjs --check
          node tools/docs/install-md.mjs --check
      # The catalog is what its pinned upstream sources make, byte for byte (the first run fetches them), and the built
      # package keeps it on @brett_lamy/ui/cloudflare alone, with no Cloudflare artwork anywhere.
      - name: Cloudflare catalog and entry
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          node tools/cloudflare/catalog.mjs --check
          node tools/cloudflare/check-package.mjs
      # What each library entry costs an app: within its budget, a name imported through a library or the root costing
      # what its own entry costs, no module bundled twice.
      - name: Entry sizes
        run: node tools/size/measure.mjs --check
      - run: pnpm exec playwright install chromium --with-deps
      - name: Behavior tests (taps, swipes, right-clicks)
        run: pnpm e2e
      - name: Accessibility (axe) — no new violations
        run: pnpm a11y
