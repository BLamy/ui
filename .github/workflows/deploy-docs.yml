name: Deploy BL UI docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'registry/**'
      - 'registry.json'
      - 'tools/registry/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the committed registry is current
        run: node tools/registry/build.mjs --check

      # Also builds the shadcn registry into apps/docs/public/r (served at /ui/r/<item>.json) first.
      - name: Build docs
        run: pnpm nx build @brett_lamy/docs-app

      - name: Check the entry CSS carries docstream's styles
        run: grep -lq 'docs-command' apps/docs/dist/assets/index-*.css || { echo "docstream styles missing from the entry CSS"; exit 1; }

      - name: Add SPA fallback
        run: cp apps/docs/dist/index.html apps/docs/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
