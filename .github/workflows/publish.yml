name: Publish packages

# Publishes every @brett_lamy/* library whose package.json version isn't on npm yet, in dependency order
# (PACKAGES below). `pnpm pack` rewrites `workspace:*` to the real versions — so docstream-editor ships pinned
# to the docstream beside it — and `npm publish` uploads the tarball with npm trusted publishing (OIDC:
# each package on npmjs.com names BLamy/ui and this workflow, publish.yml, as its trusted publisher), which
# also attaches provenance. The NPM_TOKEN repository secret is used instead, if set.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build and test libraries
        run: pnpm nx run-many -t build,test -p @brett_lamy/docstream @brett_lamy/docstream-editor @brett_lamy/ui

      - name: Publish new versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@latest
          mkdir -p "$RUNNER_TEMP/pkgs"
          # Dependencies first: the editor needs its docstream on npm, ui needs both.
          PACKAGES="docstream docstream-editor ui"
          for pkg in $PACKAGES; do
            NAME=$(node -p "require('./packages/$pkg/package.json').name")
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on npm — skipping"
              continue
            fi
            TARBALL=$(cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs" | tail -1)
            echo "Publishing $NAME@$VERSION ($TARBALL)"
            npm publish "$TARBALL" --access public
          done
