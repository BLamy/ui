name: Publish packages

# Publishes @brett_lamy/ui when its package.json version isn't on npm yet. It is the only package: every BL library is
# an entry of it (`@brett_lamy/ui/audio`, `@brett_lamy/ui/docstream`, …), and UI SDK ships inside it too
# (`@brett_lamy/ui/sdk/…`, built from the vendor/ui-sdk submodule into dist/vendor/ui-sdk). @brett_lamy/docstream and
# @brett_lamy/docstream-editor stopped at 2.0.1 and are not published from here.
# `pnpm pack` writes the tarball; `npm publish` uploads it using npm trusted publishing (OIDC — configure this
# workflow, publish.yml, as the package's trusted publisher on npmjs.com) or, if set, the NPM_TOKEN repository secret.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # vendor/ui-sdk (our UI SDK fork) is a submodule; `pnpm install` compiles it, and the library's build copies it in.
        with: { submodules: true }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The library's tests read its build (docstream's entry boundaries load every dist entry in plain Node), so a
      # version is only published once both pass.
      - name: Build and test the library
        run: pnpm nx run-many -t build,test -p @brett_lamy/ui

      # Each library entry within its budget, wide imports tree-shaking to what their own entries cost.
      - name: Entry sizes
        run: node tools/size/measure.mjs --check

      # Temporary: the claims npm's trusted publishing sees (payload only, no signature), to match its config.
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, repository, repository_owner, repository_owner_id, repository_id, workflow_ref, job_workflow_ref, ref, environment, event_name, aud}' || true

      - name: Publish new versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An absent optional token must leave npm free to use this job's OIDC identity.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
            # setup-node writes a token placeholder even for OIDC-only jobs.
            # Remove that empty credential so npm can exchange the workflow identity.
            npm config delete '//registry.npmjs.org/:_authToken'
          fi
          npm install --global npm@latest
          # Trusted publishing needs npm 11.5.1+; verbose output says why an OIDC exchange was refused.
          echo "npm $(npm --version)"
          mkdir -p "$RUNNER_TEMP/pkgs"
          for pkg in ui; do
            NAME=$(node -p "require('./packages/$pkg/package.json').name")
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on npm — skipping"
              continue
            fi
            TARBALL=$(cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs" | tail -1)
            echo "Publishing $NAME@$VERSION ($TARBALL)"
            # npm refuses a prerelease version without an explicit tag.
            case "$VERSION" in *-*) TAG="--tag latest" ;; *) TAG="" ;; esac
            npm publish "$TARBALL" --access public $TAG --loglevel verbose
          done
